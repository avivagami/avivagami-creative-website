backend:
  name: git-gateway
  branch: main

media_folder: "images/projects"
public_folder: /images/projects

collections:
  - name: content
    label: Content
    files:

      - name: projects
        label: Projects
        file: "content/projects.json"
        format: json
        fields:
          - name: items
            label: Projects
            label_singular: Project
            widget: list
            summary: "{{fields.title}} — {{fields.client}}"
            fields:
              - { name: title,  label: Title,       widget: string }
              - { name: client, label: Client,       widget: string }
              - name: year
                label: Year
                widget: select
                options:
                  - { label: "'26", value: "'26" }
                  - { label: "'25", value: "'25" }
                  - { label: "'24", value: "'24" }
                  - { label: "'23", value: "'23" }
                  - { label: "'22", value: "'22" }
                default: "'26"
              - { name: kind,   label: Type,         widget: string, hint: "e.g. creative direction · script · stage" }
              - { name: role,   label: Role,         widget: string }
              - { name: team,   label: Team size,    widget: string }
              - name: span
                label: Grid width
                widget: select
                options:
                  - { label: "Full width",    value: w12 }
                  - { label: "Wide (8 col)",  value: w8  }
                  - { label: "Wide (7 col)",  value: w7  }
                  - { label: "Half (6 col)",  value: w6  }
                  - { label: "Narrow (5 col)",value: w5  }
                  - { label: "Narrow (4 col)",value: w4  }
                default: w6
              - name: brief
                label: "The Brief"
                widget: text
                required: false
                hint: "What was the creative challenge or goal? Shown as the first section in the project lightbox."
              - name: experience
                label: "The Experience"
                widget: text
                required: false
                hint: "What was created, staged, or delivered? Shown as the second section in the project lightbox."
              - name: desc
                label: Description (legacy)
                widget: text
                required: false
                hint: "Older fallback field — only used if The Brief is empty. New projects should use The Brief / The Experience fields above."
              - name: tags
                label: Tags
                widget: list
                allow_add: true
                hint: "Suggested: Stage direction · Art direction · Video direction · Concept development · Content creation · AI video production · Copy & strategy"
              - name: image
                label: Cover image (lightbox fallback)
                widget: image
                required: false
                hint: "Used in the lightbox only if no Gallery images are uploaded. Upload a single high-res photo here, or skip and use Gallery instead."
              - name: gallery
                label: Gallery images
                widget: list
                allow_add: true
                label_singular: Image
                hint: "Upload photos. They fill the hover grid on the project card AND appear as a carousel in the lightbox. This takes priority over the Cover image above."
                field:
                  name: image
                  label: Image
                  widget: image
              - name: youtube
                label: YouTube video (optional)
                widget: string
                required: false
                hint: "Paste a YouTube URL (youtube.com/watch?v=... or youtu.be/...). The video becomes the main view when a visitor opens the project. Gallery photos appear as thumbnails below it."
              - name: link
                label: External link (optional)
                widget: string
                required: false
                hint: "Vimeo, press article, or project website. Shown as 'View project ↗' in the expanded view."

      - name: about
        label: About
        file: "content/about.json"
        format: json
        fields:
          - { name: portrait,      label: Portrait photo,   widget: image }
          - name: lede
            label: Headline
            widget: string
            hint: "Wrap words in *asterisks* to render them in the handwritten font + yellow. e.g. Concepts that *cut through*."
          - name: bio1
            label: "Bio — paragraph 1"
            widget: text
            hint: "Wrap words in *asterisks* for handwritten yellow emphasis. e.g. I'm a *Creative Director* with..."
          - name: bio2
            label: "Bio — paragraph 2"
            widget: text
            hint: "Wrap words in *asterisks* for handwritten yellow emphasis."
          - name: bio3
            label: "Bio — paragraph 3"
            widget: text
            hint: "Wrap words in *asterisks* for handwritten yellow emphasis."
          - name: bio4
            label: "Bio — paragraph 4"
            widget: text
            hint: "Wrap words in *asterisks* for handwritten yellow emphasis."
          - name: availability
            label: Availability
            widget: string
            hint: "Shown in the nav bar and About section. e.g. Available · Spring '26"

      - name: settings
        label: Site Settings
        file: "content/settings.json"
        format: json
        fields:
          - { name: email,         label: Email,            widget: string }
          - { name: phone_display, label: Phone (display),  widget: string, hint: "Shown as plain text in Contact. e.g. +972 · on request" }
          - { name: linkedin,      label: LinkedIn URL,     widget: string }
          - { name: vimeo,         label: Vimeo URL,        widget: string }
          - { name: instagram,     label: Instagram URL,    widget: string }
